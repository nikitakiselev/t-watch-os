name: build-server-image

# Пересобрать и запушить docker-образ сервера в ghcr.io при пуше в master,
# только если менялось что-то в server/ (или сам этот workflow).
on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:        # можно запустить вручную из вкладки Actions

env:
  IMAGE: ghcr.io/nikitakiselev/twatch-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN сможет пушить пакет под nikitakiselev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
